info:
  name: Get Promoted Device
  type: http
  seq: 4

http:
  method: GET
  url: "{{iot_pipeline_url}}/api/promoted-devices/:source/:deviceId"
  params:
    - name: deviceId
      value: Acurite-Tower/A/3064
      type: path
    - name: source
      value: rtl433
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
