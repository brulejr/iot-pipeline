spring.application.name: iot-pipeline
spring.profiles.active: ${PROFILE:local}

info:
  app:
    name: ${spring.application.name}
    description: IoT data processing pipeline for rtl_433 MQTT events
    profile: ${spring.profiles.active}

server:
  # 5001 rather than the Spring Boot default of 8080, which collides with other
  # local Docker containers.
  port: ${SERVER_PORT:5001}


spring:
  # PostgreSQL, holding the registries and the stored readings. Nothing connects until
  # a feature that uses it starts; see DatabaseMigrator.
  datasource:
    # The database and credentials are deliberately not defaulted. A default would point
    # at whatever listens on localhost:5432, which may be another database entirely;
    # failing to start is the safer outcome. Export the variables from .env
    # (`set -a; . ./.env; set +a`) or set spring.datasource.* in application-local.yml.
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_APP_USERNAME}
    password: ${POSTGRES_APP_PASSWORD}
    hikari:
      # Every connection works in the application's own schema, so its SQL names none.
      schema: ${pipeline.database.schema}
  integration:
    management:
      # Micrometer observations for every channel and handler (observability per stage).
      observation-patterns: "*"

pipeline:
  # The PostgreSQL schema holding every table of this application, created by its first
  # migration. Its own rather than `public`, so the database can later be shared.
  database:
    schema: iot_pipeline

  ingest:
    mqtt:
      url: ${MQTT_URL:tcp://localhost:1883}
      client-id: ${MQTT_CLIENT_ID:iot-pipeline}
      topics:
        - ${MQTT_TOPIC:rtl_433/+/events}
      source: rtl433
      # username/password: set PIPELINE_INGEST_MQTT_USERNAME / PIPELINE_INGEST_MQTT_PASSWORD

  # Fingerprinting derives three hashes per reading: the event (what dedupe compares),
  # the device (which transmitter), and the model (the payload's structure). Radio
  # metadata is excluded from both hashes by default; see FingerprintDatafill.
  fingerprint:
    enabled: true
    # excluded-model-fields / excluded-event-fields default to the radio metadata set


  # A reading whose model has a mapping the payload yields no value for is incomplete.
  # It is stored with the values it has unless drop-incomplete is set.
  parse:
    drop-incomplete: false

  # Where parsed readings land: the `readings` table. PostgreSQL has no retention period
  # of its own, so the application deletes readings older than this as it writes new
  # ones; a change applies to everything already stored.
  store:
    enabled: ${STORE_ENABLED:true}
    retention: 30d

  # Ranking of unpromoted devices; see RecommendationDatafill for how each is used.
  # Calibrated on captured traffic: nearby devices around 15-17 dB SNR, distant ones 5-6.
  # `registry` holds the hourly sightings scored into recommendations; `memory` keeps
  # them for the lifetime of the process, which is what the tests use.
  recommendation:
    registry: ${SIGHTING_REGISTRY:postgres}
    enabled: true
    window-hours: 24
    # Clock-hour buckets make 3 the smallest meaningful value: around for over an hour.
    min-hours-heard: 3
    signal-field: snr
    signal-floor: 5.0
    signal-ceiling: 17.0
    proximity-weight: 0.6
    # About 11 dB. Keeps a neighbour's always-on sensor from being flagged.
    min-proximity: 0.5

  # How stored readings are shaped for Home Assistant's MQTT discovery.
  transform:
    enabled: true
    home-assistant:
      discovery-prefix: homeassistant
      state-prefix: iot-pipeline
      origin-name: iot-pipeline
      # Retained, so Home Assistant shows the last value straight after it restarts.
      retain-state: true

  # Where transformed messages are published: the consumer's broker, separate from the
  # ingest one. A message that fails is held, latest per topic, and retried with a
  # backoff until the broker is back; see PublishService.
  # username/password: set PIPELINE_PUBLISH_MQTT_USERNAME / PIPELINE_PUBLISH_MQTT_PASSWORD
  publish:
    enabled: true
    mqtt:
      url: ${PUBLISH_MQTT_URL:tcp://localhost:1883}
      client-id: ${PUBLISH_MQTT_CLIENT_ID:iot-pipeline-publisher}
    retry:
      initial-backoff: 1s
      max-backoff: 1m

  # Promotion: devices approved to pass the gate. `postgres` keeps approvals across
  # restarts; `memory` holds them for the lifetime of the process, which is what the
  # tests use. Approvals are restored from the seed file at startup, which like the
  # model seed never overwrites what is already in the store.
  promotion:
    registry: ${PROMOTION_REGISTRY:postgres}
    seed:
      enabled: true
      location: classpath:promotion-seed.json

  # Classification: where models and their curation live, and the seed file that
  # restores curation at startup. `memory` keeps models for the lifetime of the process,
  # which is what the tests use. A seed never overwrites curation already in the store.
  classification:
    registry: ${MODEL_REGISTRY:postgres}
    seed:
      enabled: true
      location: classpath:model-seed.json

  # The live monitor behind the console's /ui/monitor page: every classified reading,
  # streamed to whoever is watching, and the devices heard recently. In memory only.
  monitor:
    max-subscribers: 8
    queue-capacity: 256
    heartbeat: 15s
    stream-timeout: 1h
    heard-for: 1h
    heard-devices: 1000

  # The operator console, served under /ui.
  console:
    refresh-interval: 10s
    recent-readings: 100

  dedupe:
    enabled: true
    # Long enough to span repeated decodes of one transmission, far shorter than a
    # sensor's reporting interval.
    window: 5s

logging:
  level:
    # Each pipeline stage logs under `pipeline.*` (ingest, known, unknown, errors).
    # DEBUG while there is no storage stage, since logs are the only record that a
    # reading arrived; drop to INFO once readings are persisted.
    pipeline: DEBUG
    # Uncomment to debug broker connections and topic subscriptions.
    # org.springframework.integration.mqtt: DEBUG

management:
  endpoints:
    web:
      base-path: /mgmt
      exposure:
        include: health,info,metrics,integrationgraph
  endpoint:
    health:
      # Each feature's indicator, with its details. Not `management.health.*`, which
      # configures the indicators themselves rather than what the endpoint shows.
      show-details: always
  info:
    build.enabled: true
    env.enabled: true
    java.enabled: true
    os.enabled: true