spring.application.name: iot-pipeline
spring.profiles.active: ${PROFILE:local}

info:
  app:
    name: ${spring.application.name}
    description: IoT data processing pipeline for rtl_433 MQTT events
    profile: ${spring.profiles.active}

server:
  # 5001 rather than the Spring Boot default of 8080, which collides with other
  # local Docker containers.
  port: ${SERVER_PORT:5001}


spring:
  # The connection lives under spring.mongodb, not spring.data.mongodb: Spring Boot 4
  # splits them, leaving only Spring Data concerns such as auto-index-creation under
  # spring.data.mongodb. A uri placed under the wrong prefix is accepted as a property,
  # bound to nothing, and the driver silently falls back to localhost:27017.
  mongodb:
    # Credentials are deliberately not defaulted. A default would build a valid-looking
    # URI pointing at whatever listens on localhost:27017, which may be another database
    # entirely; failing to start is the safer outcome. Export the variables from .env
    # (`set -a; . ./.env; set +a`) or set spring.mongodb.uri in application-local.yml.
    # The root user lives in the admin database, hence authSource.
    uri: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DATABASE}?authSource=admin
  data:
    mongodb:
      # Off: annotation-driven index creation runs when the Mongo template is built, so
      # it connects to MongoDB at startup even with every registry in memory. Registries
      # that need an index create it themselves; see MongoSightingRegistry.
      auto-index-creation: false
  integration:
    management:
      # Micrometer observations for every channel and handler (observability per stage).
      observation-patterns: "*"

pipeline:
  ingest:
    mqtt:
      url: ${MQTT_URL:tcp://localhost:1883}
      client-id: ${MQTT_CLIENT_ID:iot-pipeline}
      topics:
        - ${MQTT_TOPIC:rtl_433/+/events}
      source: rtl433
      # username/password: set PIPELINE_INGEST_MQTT_USERNAME / PIPELINE_INGEST_MQTT_PASSWORD

  # Fingerprinting derives three hashes per reading: the event (what dedupe compares),
  # the device (which transmitter), and the model (the payload's structure). Radio
  # metadata is excluded from both hashes by default; see FingerprintDatafill.
  fingerprint:
    enabled: true
    # excluded-model-fields / excluded-event-fields default to the radio metadata set


  # A reading whose model has a mapping the payload yields no value for is incomplete.
  # It is stored with the values it has unless drop-incomplete is set.
  parse:
    drop-incomplete: false

  # Where parsed readings land. The application owns this database: it creates it with
  # the retention period below, because a database InfluxDB creates implicitly on first
  # write has no retention at all and would keep readings for ever. Retention is fixed at
  # creation, so changing it here does not alter an existing database.
  store:
    enabled: ${STORE_ENABLED:true}
    url: ${INFLUXDB3_URL:http://localhost:8181}
    token: ${INFLUXDB3_TOKEN:}
    database: ${INFLUXDB3_DATABASE:sensors}
    retention: 30d

  # Ranking of unpromoted devices; see RecommendationDatafill for how each is used.
  # Calibrated on captured traffic: nearby devices around 15-17 dB SNR, distant ones 5-6.
  # `registry` holds the hourly sightings scored into recommendations; `memory` keeps
  # them for the lifetime of the process, which is what the tests use.
  recommendation:
    registry: ${SIGHTING_REGISTRY:mongo}
    enabled: true
    window-hours: 24
    # Clock-hour buckets make 3 the smallest meaningful value: around for over an hour.
    min-hours-heard: 3
    signal-field: snr
    signal-floor: 5.0
    signal-ceiling: 17.0
    proximity-weight: 0.6
    # About 11 dB. Keeps a neighbour's always-on sensor from being flagged.
    min-proximity: 0.5

  # How stored readings are shaped for Home Assistant's MQTT discovery.
  transform:
    enabled: true
    home-assistant:
      discovery-prefix: homeassistant
      state-prefix: iot-pipeline
      origin-name: iot-pipeline
      # Retained, so Home Assistant shows the last value straight after it restarts.
      retain-state: true

  # Promotion: devices approved to pass the gate. `mongo` keeps approvals across
  # restarts; `memory` holds them for the lifetime of the process, which is what the
  # tests use. Approvals are restored from the seed file at startup, which like the
  # model seed never overwrites what is already in the store.
  promotion:
    registry: ${PROMOTION_REGISTRY:mongo}
    seed:
      enabled: true
      location: classpath:promotion-seed.json

  # Classification: where models and their curation live, and the seed file that
  # restores curation at startup. `memory` keeps models for the lifetime of the process,
  # which is what the tests use. A seed never overwrites curation already in the store.
  classification:
    registry: ${MODEL_REGISTRY:mongo}
    seed:
      enabled: true
      location: classpath:model-seed.json

  dedupe:
    enabled: true
    # Long enough to span repeated decodes of one transmission, far shorter than a
    # sensor's reporting interval.
    window: 5s

logging:
  level:
    # Each pipeline stage logs under `pipeline.*` (ingest, known, unknown, errors).
    # DEBUG while there is no storage stage, since logs are the only record that a
    # reading arrived; drop to INFO once readings are persisted.
    pipeline: DEBUG
    # Uncomment to debug broker connections and topic subscriptions.
    # org.springframework.integration.mqtt: DEBUG

management:
  endpoints:
    web:
      base-path: /mgmt
      exposure:
        include: health,info,metrics,integrationgraph
  health:
    show-details: always
  info:
    build.enabled: true
    env.enabled: true
    java.enabled: true
    os.enabled: true