# Local provisioning: the application in a container, alongside the development support
# services it depends on. Usage is in docker/local/README.md.
#
# Run from the repository root, after building the jar:
#   ./gradlew bootJar
#   docker compose -f docker/local/compose.local.yaml --env-file .env up -d --build
#
# The support services come from docker/dev, under the same project name, so this adds
# the application to the development stack rather than starting a second one. Stop the
# copy running in the IDE first: two instances would store and publish everything twice.
name: iot-pipeline

include:
  - ../dev/compose.dev.yaml

services:
  app:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    image: iot-pipeline:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PROFILE: prod
      # Full property names, which outrank anything in a profile file; the short
      # placeholders in application.yml (MQTT_URL and the like) do not.
      PIPELINE_INGEST_MQTT_URL: ${INGEST_MQTT_URL:?set INGEST_MQTT_URL in .env, the broker rtl_433 publishes to}
      PIPELINE_INGEST_MQTT_CLIENT_ID: ${INGEST_MQTT_CLIENT_ID:-iot-pipeline-local}
      PIPELINE_PUBLISH_MQTT_URL: ${PUBLISH_MQTT_URL:?set PUBLISH_MQTT_URL in .env, the broker Home Assistant listens on}
      PIPELINE_PUBLISH_MQTT_CLIENT_ID: ${PUBLISH_MQTT_CLIENT_ID:-iot-pipeline-local-publisher}
      # Inside the compose network PostgreSQL is always on 5432, whatever POSTGRES_PORT
      # publishes it as on the host.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?run scripts/bootstrap.sh first}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_APP_USERNAME:?run scripts/bootstrap.sh first}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_APP_PASSWORD:?run scripts/bootstrap.sh first}
    ports:
      - "${APP_PORT:-5001}:5001"
    restart: unless-stopped
