# Production: the application and everything it depends on, on one Docker host. The
# host is managed by Ansible, which checks out this repository, builds the jar and runs
# this file; see docker/prod/README.md for what it must provide.
#
#   ./gradlew bootJar
#   docker compose -f docker/prod/compose.prod.yaml --env-file <env file> up -d --build
#
# Self-contained rather than including docker/dev: production publishes PostgreSQL on
# loopback only. Keep the shared services in step with docker/dev by hand.
name: iot-pipeline

services:
  app:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    image: iot-pipeline:${APP_VERSION:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PROFILE: prod
      # Full property names, which outrank anything in a profile file.
      PIPELINE_INGEST_MQTT_URL: ${INGEST_MQTT_URL:?set INGEST_MQTT_URL, the broker rtl_433 publishes to}
      PIPELINE_INGEST_MQTT_CLIENT_ID: ${INGEST_MQTT_CLIENT_ID:-iot-pipeline}
      PIPELINE_PUBLISH_MQTT_URL: ${PUBLISH_MQTT_URL:?set PUBLISH_MQTT_URL, the broker Home Assistant listens on}
      PIPELINE_PUBLISH_MQTT_CLIENT_ID: ${PUBLISH_MQTT_CLIENT_ID:-iot-pipeline-publisher}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_APP_USERNAME:?set POSTGRES_APP_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD}
    ports:
      - "${APP_PORT:-5001}:5001"
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_APP_USERNAME: ${POSTGRES_APP_USERNAME:?set POSTGRES_APP_USERNAME}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD}
      POSTGRES_GRAFANA_PASSWORD: ${POSTGRES_GRAFANA_PASSWORD:?set POSTGRES_GRAFANA_PASSWORD}
    ports:
      # Loopback only: the application and Grafana reach it over the compose network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/initdb:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:13.0.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_GRAFANA_PASSWORD: ${POSTGRES_GRAFANA_PASSWORD:?set POSTGRES_GRAFANA_PASSWORD}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning:ro,z
    restart: unless-stopped

volumes:
  postgres-data:
  grafana-data:
