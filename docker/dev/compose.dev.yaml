# Development support services: PostgreSQL for the registries and the stored readings
# (owned solely by the pipeline), and Grafana as an external read-only consumer. The
# application itself runs in the IDE; see docker/local for running it here too. Usage is
# in docker/dev/README.md.
#
# Run from the repository root, which holds .env:
#   docker compose -f docker/dev/compose.dev.yaml --env-file .env up -d
name: iot-pipeline

services:
  # Holds everything the application keeps: the model, promotion and sighting registries,
  # and the stored readings, all in the iot_pipeline schema. The application's role owns
  # that schema and creates its tables; Grafana reads them through a SELECT-only role.
  # Both roles are created by docker/postgres/initdb on the first start with an empty
  # volume, so changing their passwords in .env afterwards needs ALTER ROLE as well.
  postgres:
    image: postgres:17
    environment:
      # The instance's superuser, for administration only; the application has its own.
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?run scripts/bootstrap.sh first}
      POSTGRES_DB: ${POSTGRES_DB:?run scripts/bootstrap.sh first}
      POSTGRES_APP_USERNAME: ${POSTGRES_APP_USERNAME:?run scripts/bootstrap.sh first}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?run scripts/bootstrap.sh first}
      POSTGRES_GRAFANA_PASSWORD: ${POSTGRES_GRAFANA_PASSWORD:?run scripts/bootstrap.sh first}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # :z relabels the files for SELinux hosts (e.g. Fedora); harmless elsewhere.
      - ../postgres/initdb:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      # Over TCP, which the server only listens on once initialisation has finished; the
      # socket answers earlier, while the init scripts are still running.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:13.0.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run scripts/bootstrap.sh first}
      POSTGRES_DB: ${POSTGRES_DB:?run scripts/bootstrap.sh first}
      POSTGRES_GRAFANA_PASSWORD: ${POSTGRES_GRAFANA_PASSWORD:?run scripts/bootstrap.sh first}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning:ro,z
    restart: unless-stopped

volumes:
  postgres-data:
  grafana-data:
