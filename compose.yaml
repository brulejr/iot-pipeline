# Local infrastructure for the IoT pipeline: InfluxDB 3 Core for sensor readings and
# MongoDB for the model registry (both owned solely by the pipeline), with Grafana as an
# external read-only consumer.
#
# First run:   ./scripts/bootstrap.sh   # creates the admin token and .env
# Then:        docker compose up -d
#
# InfluxDB: http://localhost:8181   Grafana: http://localhost:3000 (admin / see .env)
# MongoDB:  localhost:27017 (credentials in .env)
# InfluxDB 3 Explorer: http://localhost:8888 (a query UI, already connected to InfluxDB)
# Host ports can be changed with INFLUXDB3_PORT, GRAFANA_PORT, MONGO_PORT and
# EXPLORER_PORT in .env.
name: iot-pipeline

services:
  influxdb3:
    image: influxdb:3.12-core
    command:
      - influxdb3
      - serve
      - --node-id=${INFLUXDB3_NODE_ID:-node0}
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      - --admin-token-file=/etc/influxdb3/admin-token.json
      # Let the healthcheck probe /health without a token; everything else requires auth.
      - --disable-authz=health,ping
    ports:
      - "${INFLUXDB3_PORT:-8181}:8181"
    volumes:
      - influxdb3-data:/var/lib/influxdb3
      # :z relabels the file for SELinux hosts (e.g. Fedora); harmless elsewhere.
      - ./docker/influxdb3/secrets/admin-token.json:/etc/influxdb3/admin-token.json:ro,z
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8181/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:13.0.2
    depends_on:
      influxdb3:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run scripts/bootstrap.sh first}
      INFLUXDB3_TOKEN: ${INFLUXDB3_TOKEN:?run scripts/bootstrap.sh first}
      INFLUXDB3_DATABASE: ${INFLUXDB3_DATABASE:-sensors}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro,z
    restart: unless-stopped

  # Holds the model registry: payload structures discovered from live traffic, plus the
  # sensor mappings curated against them. Separate from InfluxDB, which stores readings.
  mongodb:
    image: mongo:8.0
    environment:
      # Setting a root username enables auth; the user is created in the admin database,
      # which is why the application connects with authSource=admin.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:?run scripts/bootstrap.sh first}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?run scripts/bootstrap.sh first}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # InfluxData's own UI for InfluxDB 3: schema browser and SQL editor. Arrives
  # connected to the readings database, because Explorer creates the server described
  # by the DEFAULT_* variables for each new browser session.
  influxdb3-explorer:
    image: influxdata/influxdb3-ui:1.9.0
    depends_on:
      influxdb3:
        condition: service_healthy
    environment:
      # `query` is read-only: browse and query, but no creating or deleting databases
      # or tokens. The application owns the database and its retention period, so that
      # is the safer default; set EXPLORER_MODE=admin when you need the rest.
      UI_MODE: ${EXPLORER_MODE:-query}
      # Fixed rather than generated, so a restart does not sign every browser out.
      SESSION_SECRET_KEY: ${EXPLORER_SESSION_SECRET:?run scripts/bootstrap.sh first}
      DEFAULT_SERVER_NAME: iot-pipeline
      # Explorer's backend makes the connection, so this is the compose-network name.
      DEFAULT_INFLUX_SERVER: http://influxdb3:8181
      DEFAULT_INFLUX_DATABASE: ${INFLUXDB3_DATABASE:-sensors}
      DEFAULT_API_TOKEN: ${INFLUXDB3_TOKEN:?run scripts/bootstrap.sh first}
    ports:
      # Loopback only. Explorer has no login of its own but holds the admin token, so
      # published on every interface it would hand the whole database to anyone on the
      # network. Reach it from another machine through an SSH tunnel instead.
      # The container listens on 8080; the host side is moved off it, since 8080 is
      # taken by other local containers.
      - "127.0.0.1:${EXPLORER_PORT:-8888}:8080"
    volumes:
      # Saved queries and sessions.
      - influxdb3-explorer-data:/db
    restart: unless-stopped

volumes:
  influxdb3-data:
  grafana-data:
  mongodb-data:
  influxdb3-explorer-data:
